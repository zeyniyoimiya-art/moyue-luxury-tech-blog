[package]
name = "moyue-wasm"
version = "0.1.0"
edition = "2021"
description = "Procesado de datasets históricos y de cobertura para 墨玥 MoYue (Lin Yue 林玥)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
